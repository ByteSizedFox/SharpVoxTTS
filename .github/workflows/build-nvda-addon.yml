name: "Build NVDA addon"

on:
  workflow_dispatch:
  push:

concurrency:
  group: "nvda-addon-build"
  cancel-in-progress: true

jobs:
  build-addon-32bit:
    name: "Build NVDA addon (32-bit)"
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Disable initramfs update
      run: sudo sed -i 's/yes/no/g' /etc/initramfs-tools/update-initramfs.conf
    - name: Disable man-db update
      run: sudo rm -f /var/lib/man-db/auto-update
    - name: Install packages
      run: sudo apt-get update && sudo apt-get install mingw-w64 zip
    - name: Build addon
      run: |
        cd platform/nvda
        ./build.sh 32
    - name: Organize artifacts
      run: |
        rm -rf addon-32bit
        mkdir -p addon-32bit
        cp platform/nvda/SharpVoxTTS-32bit-*.nvda-addon addon-32bit/
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: addon-32bit
        path: addon-32bit/

  build-addon-64bit:
    name: "Build NVDA addon (64-bit)"
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Disable initramfs update
      run: sudo sed -i 's/yes/no/g' /etc/initramfs-tools/update-initramfs.conf
    - name: Disable man-db update
      run: sudo rm -f /var/lib/man-db/auto-update
    - name: Install packages
      run: sudo apt-get update && sudo apt-get install mingw-w64 zip
    - name: Build addon
      run: |
        cd platform/nvda
        ./build.sh 64
    - name: Organize artifacts
      run: |
        rm -rf addon-64bit
        mkdir -p addon-64bit
        cp platform/nvda/SharpVoxTTS-64bit-*.nvda-addon addon-64bit/
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: addon-64bit
        path: addon-64bit/

  build-android:
    name: "Build Android release APK"
    runs-on: ubuntu-latest

    permissions:
      contents: write

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - name: Install Android SDK components
      run: |
        export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH"
        yes | sdkmanager --licenses >/dev/null
        sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973" "cmake;3.22.1"
    - name: Check signing secrets
      run: |
        if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
          echo "Missing Android signing secrets (ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD)." >&2
          exit 1
        fi
      env:
        ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    - name: Write signing keystore
      run: echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/keystore.jks"
      env:
        ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    - name: Build release APK
      run: ./gradlew assembleRelease
      working-directory: platform/android
      env:
        ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/keystore.jks
        ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    - name: Organize artifact
      run: |
        rm -rf android-release
        mkdir -p android-release
        cp platform/android/app/build/outputs/apk/release/app-release.apk android-release/SharpVoxTTS-release.apk
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: android-release
        path: android-release/

  release:
    name: "Release"
    runs-on: ubuntu-latest

    permissions:
      contents: write

    # Only roll the public "latest" release from the default branch
    if: github.ref == 'refs/heads/main'

    needs: [build-addon-32bit, build-addon-64bit, build-android]

    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Download from build-addon-32bit
      uses: actions/download-artifact@v4
      with:
        name: addon-32bit
        path: addon-32bit
    - name: Download from build-addon-64bit
      uses: actions/download-artifact@v4
      with:
        name: addon-64bit
        path: addon-64bit
    - name: Download from build-android
      uses: actions/download-artifact@v4
      with:
        name: android-release
        path: android-release
    - name: Delete old release
      run: gh release delete "latest" --cleanup-tag -y || true
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - name: Collect release assets
      run: |
        mkdir -p release-assets
        cp addon-32bit/*.nvda-addon release-assets/
        cp addon-64bit/*.nvda-addon release-assets/
        cp android-release/SharpVoxTTS-release.apk release-assets/
    - name: Release
      run: gh release create -t "SharpVoxTTS-latest" "latest" release-assets/* -n "Latest SharpVoxTTS NVDA addon and Android APK builds"
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
