plugins {
    alias(libs.plugins.android.application)
}

def keystoreFileEnv = System.getenv('ANDROID_KEYSTORE_FILE')
def keystorePasswordEnv = System.getenv('ANDROID_KEYSTORE_PASSWORD')
def keyAliasEnv = System.getenv('ANDROID_KEY_ALIAS')
def keyPasswordEnv = System.getenv('ANDROID_KEY_PASSWORD')

android {
    namespace 'dev.bytesizedfox.sharpvoxapp'
    compileSdk 35

    signingConfigs {
        release {
            if (keystoreFileEnv) {
                storeFile file(keystoreFileEnv)
                storePassword keystorePasswordEnv
                keyAlias keyAliasEnv
                keyPassword keyPasswordEnv
            }
        }
    }

    defaultConfig {
        applicationId "dev.bytesizedfox.sharpvoxapp"
        minSdk 31
        targetSdk 35
        versionCode 1
        versionName "2.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (keystoreFileEnv) {
                signingConfig signingConfigs.release
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }
    buildFeatures {
        viewBinding true
    }
    ndkVersion '27.0.12077973'
}

dependencies {

    implementation libs.appcompat
    implementation libs.material
    implementation libs.constraintlayout
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
}